name: Windows Portable

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            harness/package-lock.json
      - name: Install FFmpeg
        run: |
          $ErrorActionPreference = "Stop"
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install ffmpeg --yes --no-progress
            $installExitCode = $LASTEXITCODE
            $ffmpegCommand = Get-Command ffmpeg -ErrorAction SilentlyContinue
            $ffprobeCommand = Get-Command ffprobe -ErrorAction SilentlyContinue
            if ($installExitCode -eq 0 -and $ffmpegCommand -and $ffprobeCommand) {
              ffmpeg -version
              if ($LASTEXITCODE -ne 0) { throw "FFmpeg verification failed" }
              ffprobe -version
              if ($LASTEXITCODE -ne 0) { throw "ffprobe verification failed" }
              break
            }
            if ($attempt -eq 3) { throw "FFmpeg and ffprobe were not installed after 3 attempts" }
            Write-Warning "FFmpeg installation incomplete; retrying attempt $($attempt + 1) of 3"
            Start-Sleep -Seconds 5
          }
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-build.txt
      - name: Build and verify Windows Portable
        run: pwsh -NoProfile -File scripts/build-windows-portable.ps1
      - name: Upload Windows Portable
        uses: actions/upload-artifact@v4
        with:
          name: director-studio-windows-x64
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/Director-Studio-Windows-x64.zip
            dist/Director-Studio-Windows-x64.zip.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: director-studio-windows-x64
          path: dist
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            dist/Director-Studio-Windows-x64.zip \
            dist/Director-Studio-Windows-x64.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
