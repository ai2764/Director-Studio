name: macOS Portable

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - "codex/macos-portable"
    tags:
      - "v*"

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install system tools
        run: brew install ffmpeg shellcheck
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-build.txt
      - name: Check launch scripts
        run: shellcheck launch.sh install-tools.sh Launch.command Install-Tools.command
      - name: Build and verify macOS Portable
        run: python scripts/build_macos_portable.py
      - name: Upload macOS Portable
        uses: actions/upload-artifact@v4
        with:
          name: director-studio-macos-${{ matrix.arch }}
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/Director-Studio-macOS-${{ matrix.arch }}.tar.gz
            dist/Director-Studio-macOS-${{ matrix.arch }}.tar.gz.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: director-studio-macos-*
          merge-multiple: true
          path: dist
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 --repo "$GITHUB_REPOSITORY" --clobber
